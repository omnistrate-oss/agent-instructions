# yaml-language-server: $schema=https://api.omnistrate.cloud/2022-09-01-00/schema/service-spec-schema.json
#
# GitLab — Omnistrate ServicePlanSpec
# Chart: gitlab/gitlab version 10.2.0 (appVersion v19.2.0)
# Deployment models: hostedDeployment (Starter tier) + byoaDeployment (Enterprise tier)
# Cloud: AWS us-east-1 (production-grade)
#
# Managed dependencies (Option B — chosen for production):
#   - RDS PostgreSQL  (replaces bundled postgresql subchart)
#   - ElastiCache Redis (replaces in-cluster redis)
#   - S3 buckets       (replaces bundled minio; GitLab needs several buckets)
#
# External-service value paths (real values from `helm show values gitlab/gitlab`):
#   PostgreSQL: global.psql.host, global.psql.port, global.psql.username,
#               global.psql.database, global.psql.password.secret,
#               global.psql.password.key
#   Redis:      global.redis.host, global.redis.port,
#               global.redis.auth.secret, global.redis.auth.key
#   Object store: global.appConfig.object_store.enabled,
#                 global.appConfig.object_store.connection.secret/key,
#                 global.appConfig.lfs.bucket, global.appConfig.artifacts.bucket,
#                 global.appConfig.uploads.bucket, global.appConfig.packages.bucket,
#                 global.appConfig.backups.bucket
#   Subchart disable toggles:
#     postgresql subchart is NOT a direct toggle in the umbrella chart values.
#     Redis is managed via global.redis.host (point at external host to bypass internal).
#     Minio has no direct subchart — GitLab uses internal minio by default when
#     object_store is not configured; setting global.appConfig.object_store.enabled=true
#     with an S3 connection secret disables the internal minio path.
#     gitlab-runner.install: true  (keep enabled)
#     prometheus.install: true     (keep enabled for observability)
#     installCertmanager: true     (managed by cell amenities; can set false)

name: GitLab
deployment:
  hostedDeployment:
    AwsAccountId: "<YOUR_AWS_ACCOUNT_ID>"
    AWSBootstrapRoleAccountArn: "arn:aws:iam::<YOUR_AWS_ACCOUNT_ID>:role/omnistrate-bootstrap-role"
  byoaDeployment:
    AwsAccountId: "<YOUR_PROVISIONER_AWS_ACCOUNT_ID>"
    AWSBootstrapRoleAccountArn: "arn:aws:iam::<YOUR_PROVISIONER_AWS_ACCOUNT_ID>:role/omnistrate-bootstrap-role"

services:
  # ─────────────────────────────────────────────────────────────────────────────
  # INTERNAL TERRAFORM SERVICE — managed cloud dependencies
  # Provisions: RDS PostgreSQL + ElastiCache Redis + S3 buckets
  # The GitLab Helm chart then points at these via global.psql.*, global.redis.*,
  # and global.appConfig.object_store.* values.
  # ─────────────────────────────────────────────────────────────────────────────
  - name: gitlabManagedInfra
    internal: true
    terraformConfigurations:
      configurationPerCloudProvider:
        aws:
          # TODO-GAP: The guide provides no git-backed example for multi-resource
          # terraform combining RDS + ElastiCache + S3 in one service. The pattern
          # below uses artifactRelativePath (local artifact mode) which requires
          # omnistrate-ctl build from the examples/helm/gitlab directory.
          terraformPath: /terraform
          artifactRelativePath: terraform
          variablesValuesFileOverride: |
            vpc_id             = "{{ $sys.deploymentCell.cloudProviderNetworkID }}"
            region             = "{{ $sys.deploymentCell.region }}"
            resource_prefix    = "gitlab-{{ $sys.id }}"
            private_subnet_ids = [
              "{{ $sys.deploymentCell.privateSubnetIDs[0].id }}",
              "{{ $sys.deploymentCell.privateSubnetIDs[1].id }}"
            ]
            public_subnet_ids  = [
              "{{ $sys.deploymentCell.publicSubnetIDs[0].id }}",
              "{{ $sys.deploymentCell.publicSubnetIDs[1].id }}"
            ]

  # ─────────────────────────────────────────────────────────────────────────────
  # CUSTOMER-FACING HELM SERVICE — GitLab umbrella chart
  # ─────────────────────────────────────────────────────────────────────────────
  - name: GitLab
    dependsOn:
      - gitlabManagedInfra
    compute:
      instanceTypes:
        - cloudProvider: aws
          name: m6i.2xlarge     # GitLab minimum recommended: 4 vCPU / 15 GiB RAM
    network:
      ports:
        - 443
        - 22
        - 80
    endpointConfiguration:
      https:
        host: $sys.network.externalClusterEndpoint
        ports:
          - 443
        primary: true
        networkingType: PUBLIC
    helmChartConfiguration:
      chartName: gitlab
      chartVersion: "10.2.0"
      chartRepoName: gitlab
      chartRepoURL: https://charts.gitlab.io
      runtimeConfiguration:
        wait: true
        waitForJobs: true
        timeoutNanos: 1800000000000   # 30 minutes — GitLab has many init jobs
        disableHooks: false
        skipCRDs: false
        upgradeCRDs: false
        reuseValues: true
      chartAffinityControl:
        enableInjection: true
        enableSharedHost: false     # enforce separate hosts for GitLab pods
      chartValues:
        # ── Global hosts ──────────────────────────────────────────────────────
        global:
          hosts:
            domain: $sys.network.externalClusterEndpoint
            https: true
            externalIP: ""

          # ── External PostgreSQL (RDS) ────────────────────────────────────
          # Paths: global.psql.host, global.psql.port, global.psql.username,
          #        global.psql.database, global.psql.password.{secret,key}
          psql:
            host: "{{ $gitlabManagedInfra.out.rds_endpoint }}"
            port: 5432
            username: "gitlab"
            database: "gitlabhq_production"
            password:
              secret: gitlab-postgresql-password
              key: postgresql-password

          # ── External Redis (ElastiCache) ──────────────────────────────────
          # Paths: global.redis.host, global.redis.port,
          #        global.redis.auth.enabled, global.redis.auth.secret/key
          redis:
            host: "{{ $gitlabManagedInfra.out.redis_endpoint }}"
            port: 6379
            auth:
              enabled: false    # ElastiCache Redis (no-auth mode); set true + secret if AUTH enabled

          # ── Object storage (S3) ──────────────────────────────────────────
          # Path: global.appConfig.object_store.enabled + connection secret
          # Individual buckets: global.appConfig.{lfs,artifacts,uploads,packages,backups}.bucket
          appConfig:
            object_store:
              enabled: true
              proxy_download: true
              connection:
                secret: gitlab-object-storage
                key: connection
            lfs:
              enabled: true
              proxy_download: true
              bucket: "{{ $gitlabManagedInfra.out.s3_lfs_bucket }}"
            artifacts:
              enabled: true
              proxy_download: true
              bucket: "{{ $gitlabManagedInfra.out.s3_artifacts_bucket }}"
            uploads:
              enabled: true
              proxy_download: true
              bucket: "{{ $gitlabManagedInfra.out.s3_uploads_bucket }}"
            packages:
              enabled: true
              proxy_download: true
              bucket: "{{ $gitlabManagedInfra.out.s3_packages_bucket }}"
            backups:
              bucket: "{{ $gitlabManagedInfra.out.s3_backups_bucket }}"
              tmpBucket: "{{ $gitlabManagedInfra.out.s3_tmp_bucket }}"

          # ── Initial root password ─────────────────────────────────────────
          initialRootPassword:
            secret: gitlab-initial-root-password
            key: password

          # ── Edition ───────────────────────────────────────────────────────
          edition: ee    # Change to ce for Community Edition

        # ── Cert-manager (cell amenity handles TLS; disable chart's own install) ──
        installCertmanager: false

        # ── nginx-ingress (cell amenity provides ingress; disable chart's own) ──
        nginx-ingress:
          enabled: false

        # ── Prometheus (keep install for observability) ───────────────────────
        prometheus:
          install: true

        # ── GitLab Runner (keep enabled) ──────────────────────────────────────
        gitlab-runner:
          install: true

        # ── Webservice resources (min viable for production starter) ─────────
        gitlab:
          webservice:
            replicaCount: 2
            resources:
              requests:
                cpu: 300m
                memory: 2.5G
              limits:
                cpu: "1"
                memory: 4G

          sidekiq:
            replicaCount: 1
            resources:
              requests:
                cpu: 200m
                memory: 1G

        # ── Ingress / gateway-api ─────────────────────────────────────────────
        global:
          gatewayApi:
            enabled: false    # Use nginx ingress instead (simpler for Omnistrate cells)
          ingress:
            enabled: true
            provider: nginx
            configureCertmanager: true

    apiParameters:
      # Tier-1 customer-facing parameters
      - key: gitlabEdition
        name: GitLab Edition
        description: "GitLab edition to deploy: ee (Enterprise Edition) or ce (Community Edition)"
        type: String
        required: false
        defaultValue: "ee"
        export: true
        modifiable: false
        options:
          - ee
          - ce
        tabIndex: 1

      - key: rootPassword
        name: Root Password
        description: "Initial GitLab root account password. Must be at least 8 characters."
        type: Password
        required: true
        modifiable: false
        export: false
        tabIndex: 2

      - key: instanceType
        name: Instance Type
        description: "EC2 instance type for GitLab nodes. Minimum recommended: m6i.2xlarge (4 vCPU/15GiB)."
        type: String
        required: false
        defaultValue: "m6i.2xlarge"
        export: true
        modifiable: false
        options:
          - m6i.2xlarge
          - m6i.4xlarge
          - m6i.8xlarge
        tabIndex: 3

      - key: webserviceReplicas
        name: Webservice Replicas
        description: "Number of GitLab webservice (Rails) replicas. Minimum 2 for HA."
        type: Float64
        required: false
        defaultValue: "2"
        export: true
        modifiable: true
        limits:
          min: 1
          max: 10
        tabIndex: 4

      - key: dbInstanceClass
        name: Database Instance Class
        description: "RDS PostgreSQL instance class for the GitLab database."
        type: String
        required: false
        defaultValue: "db.t3.large"
        export: true
        modifiable: false
        options:
          - db.t3.large
          - db.r6g.large
          - db.r6g.xlarge
          - db.r6g.2xlarge
        tabIndex: 5

      - key: redisNodeType
        name: Redis Node Type
        description: "ElastiCache Redis node type."
        type: String
        required: false
        defaultValue: "cache.t3.medium"
        export: true
        modifiable: false
        options:
          - cache.t3.medium
          - cache.r6g.large
          - cache.r6g.xlarge
        tabIndex: 6
