# yaml-language-server: $schema=https://api.omnistrate.cloud/2022-09-01-00/schema/service-spec-schema.json
# Omnistrate ServicePlanSpec for Redis (Bitnami chart)
# Deployment model: hostedDeployment — AWS us-east-1 (ISV's own account)
# Chart: bitnami/redis version 27.0.15 (appVersion 8.8.0)
# Generated by onboarding simulation — replace <AWS_ACCOUNT_ID> with your account ID.

name: Redis Server
deployment:
  hostedDeployment:
    AwsAccountId: "<AWS_ACCOUNT_ID>"
    AWSBootstrapRoleAccountArn: "arn:aws:iam::<AWS_ACCOUNT_ID>:role/omnistrate-bootstrap-role"

services:
  - name: Redis Cluster
    compute:
      instanceTypes:
        - apiParam: instanceType
          cloudProvider: aws
    network:
      ports:
        - 6379
    helmChartConfiguration:
      chartName: redis
      chartVersion: "27.0.15"
      chartRepoName: bitnami
      chartRepoURL: https://charts.bitnami.com/bitnami
      # Automatic affinity injection enabled (default) — Omnistrate pins pods to managed nodes.
      # chartAffinityControl.enableInjection: true is the default; no need to override.
      runtimeConfiguration:
        wait: true
        timeoutNanos: 600000000000  # 10 minutes — Redis StatefulSet readiness can take time
      chartValues:
        # Architecture: standalone for simplicity at first deploy (change to replication via apiParam after zero-param deploy)
        architecture: $var.architecture
        auth:
          enabled: true
          password: $secret.REDIS_PASSWORD
        master:
          replicaCount: 1
          service:
            type: LoadBalancer
            annotations:
              external-dns.alpha.kubernetes.io/hostname: $sys.network.externalClusterEndpoint
          persistence:
            enabled: true
            size: $var.storageSizeGi
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
        replica:
          replicaCount: $var.numReplicas
          persistence:
            enabled: true
            size: $var.storageSizeGi
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
        metrics:
          enabled: false
        sentinel:
          enabled: false
    endpointConfiguration:
      redisEndpoint:
        host: "$sys.network.externalClusterEndpoint"
        ports:
          - 6379
        primary: true
        networkingType: PUBLIC
    apiParameters:
      - key: instanceType
        name: Instance Type
        description: AWS EC2 instance type for Redis nodes
        type: String
        modifiable: true
        required: false
        export: true
        defaultValue: "t4g.small"
        tabIndex: 1
      - key: architecture
        name: Redis Architecture
        description: "Redis deployment architecture: standalone (single node) or replication (master + replicas)"
        type: String
        modifiable: false
        required: false
        export: true
        defaultValue: "replication"
        options:
          - "standalone"
          - "replication"
        tabIndex: 2
      - key: numReplicas
        name: Replica Count
        description: Number of Redis replica nodes (only used when architecture is replication)
        type: Float64
        modifiable: true
        required: false
        export: true
        defaultValue: "1"
        limits:
          min: 0
          max: 5
        tabIndex: 3
      - key: storageSizeGi
        name: Storage Size
        description: Persistent volume size for each Redis node (e.g. 8Gi, 20Gi)
        type: String
        modifiable: false
        required: false
        export: true
        defaultValue: "8Gi"
        tabIndex: 4
