# yaml-language-server: $schema=https://api.omnistrate.cloud/2022-09-01-00/schema/service-spec-schema.json
# Omnistrate ServicePlanSpec for MySQL (Bitnami chart)
# Deployment model: onPremDeployment — Air-gapped installer (no live control-plane link)
# Chart: bitnami/mysql version 14.0.3 (appVersion 9.4.0)
# Images: docker.io/bitnami/mysql:9.4.0-debian-12-r1
#         docker.io/bitnami/mysqld-exporter:0.17.2-debian-12-r16
#         docker.io/bitnami/os-shell:12-debian-12-r50
# Generated by onboarding simulation — replace <AWS_ACCOUNT_ID> with your account ID.
#
# INSTALLER DELIVERY: customer receives a self-contained artifact (images embedded via
# INSTALLER_EMBED pullMode); no internet access required at install time.

name: MySQL Air-Gapped Installer
deployment:
  requirements:
    k8sVersion: ">=1.30.0"
  onPremDeployment:
    AwsAccountId: "<AWS_ACCOUNT_ID>"
    AWSBootstrapRoleAccountArn: "arn:aws:iam::<AWS_ACCOUNT_ID>:role/omnistrate-bootstrap-role"
  onPremInstallerTools:
    helperUserScript: |
      #!/bin/bash
      log_info() { echo "[INFO] $1"; }
      log_error() { echo "[ERROR] $1" >&2; }
      require_cmd() { command -v "$1" >/dev/null 2>&1 || { log_error "Required command '$1' not found"; exit 1; }; }

# Image sync service — copies images into the customer's air-gapped registry
# before the MySQL Helm chart is installed. Uses INSTALLER_EMBED so images are
# bundled into the artifact at build time; no internet needed at install time.
services:
  - name: MySQLImageSync
    internal: true
    containerImagesRegistryCopyConfiguration:
      pullMode: "INSTALLER_EMBED"
      pullSource:
        registryURL: "docker.io"
        repositoryName: "bitnami"
        credentials:
          username: "{{ $secret.REGISTRY_USERNAME }}"
          password: "{{ $secret.REGISTRY_PASSWORD }}"
      pushTarget:
        registryURL: "{{ $var.privateRegistryUrl }}"
        repositoryName: "bitnami"

  - name: MySQL
    dependsOn:
      - MySQLImageSync
    network:
      ports:
        - 3306
    helmChartConfiguration:
      chartName: mysql
      chartVersion: "14.0.3"
      chartRepoName: bitnami
      chartRepoURL: https://charts.bitnami.com/bitnami
      releaseName: "{{ $var.releaseName }}"
      namespace: "{{ $var.namespace }}"
      runtimeConfiguration:
        wait: true
        timeoutNanos: 600000000000   # 10 minutes — StatefulSet init can be slow on bare-metal
      chartValues:
        # Architecture: standalone (single primary, no replicas) for air-gapped simplicity.
        # Change to "replication" once validated — adds secondary replicas.
        architecture: standalone
        global:
          # Point all image pulls at the customer's internal registry (synced above)
          imageRegistry: $var.privateRegistryUrl
        auth:
          rootPassword: $secret.MYSQL_ROOT_PASSWORD
          database: $var.databaseName
          username: $var.dbUsername
          password: $secret.MYSQL_USER_PASSWORD
          # usePasswordFiles=true is the chart default; keep it
          usePasswordFiles: true
        primary:
          persistence:
            enabled: true
            size: $var.primaryStorageSize
            # storageClass is Tier-3 (platform-owned) — do NOT expose to customers
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          service:
            type: ClusterIP        # air-gapped: no external LB; internal only
        secondary:
          replicaCount: 0          # standalone arch: no secondaries
          persistence:
            enabled: false
        metrics:
          enabled: false           # Tier-2: keep disabled unless ISV requests
        tls:
          enabled: false           # Tier-2: disabled by default, enable via upgrade

    # Expose MySQL only within the customer cluster (air-gapped — no external LB)
    endpointConfiguration:
      mysqlEndpoint:
        host: "$sys.network.internalClusterEndpoint"
        ports:
          - 3306
        primary: true
        networkingType: INTERNAL

    # Action hooks — run at lifecycle points on the customer's cluster
    actionHooks:
      - scope: CLUSTER
        type: VALIDATE
        commandTemplate: |
          #!/bin/bash
          set -e
          echo "[VALIDATE] Checking kubectl connectivity..."
          kubectl version --client >/dev/null 2>&1 || { echo "kubectl not found"; exit 1; }
          echo "[VALIDATE] Checking Kubernetes version >= 1.30..."
          K8S_MINOR=$(kubectl version -o json 2>/dev/null | python3 -c "import sys,json; v=json.load(sys.stdin); print(v['serverVersion']['minor'].rstrip('+'))" 2>/dev/null || echo "0")
          [ "${K8S_MINOR}" -ge "30" ] || { echo "Kubernetes >= 1.30 required; found minor: ${K8S_MINOR}"; exit 1; }
          echo "[VALIDATE] Checking private registry accessibility from cluster..."
          REGISTRY_URL="{{ $var.privateRegistryUrl }}"
          [ -n "${REGISTRY_URL}" ] || { echo "privateRegistryUrl parameter must be set"; exit 1; }
          echo "[VALIDATE] Checking available storage..."
          kubectl get storageclass >/dev/null 2>&1 || { echo "No StorageClass found; persistent volumes will fail"; exit 1; }
          echo "[VALIDATE] All checks passed."

      - scope: CLUSTER
        type: PRE_INSTALL
        commandTemplate: |
          #!/bin/bash
          set -e
          echo "[PRE_INSTALL] Creating namespace {{ $var.namespace }} if it does not exist..."
          kubectl create namespace "{{ $var.namespace }}" --dry-run=client -o yaml | kubectl apply -f -
          echo "[PRE_INSTALL] Creating imagePullSecret for internal registry..."
          kubectl create secret docker-registry omnistrate-registry-secret \
            --namespace "{{ $var.namespace }}" \
            --docker-server="{{ $var.privateRegistryUrl }}" \
            --docker-username="{{ $secret.REGISTRY_USERNAME }}" \
            --docker-password="{{ $secret.REGISTRY_PASSWORD }}" \
            --dry-run=client -o yaml | kubectl apply -f -
          echo "[PRE_INSTALL] Namespace and pull secret ready."

      - scope: CLUSTER
        type: POST_INSTALL
        commandTemplate: |
          #!/bin/bash
          set -e
          echo "[POST_INSTALL] Waiting for MySQL primary pod to be Ready..."
          kubectl rollout status statefulset \
            --namespace "{{ $var.namespace }}" \
            --timeout=300s \
            --selector="app.kubernetes.io/name=mysql,app.kubernetes.io/component=primary" \
            2>/dev/null || \
          kubectl wait pod \
            --namespace "{{ $var.namespace }}" \
            --for=condition=Ready \
            --selector="app.kubernetes.io/name=mysql,app.kubernetes.io/component=primary" \
            --timeout=300s
          echo "[POST_INSTALL] MySQL primary is Ready."
          echo "[POST_INSTALL] Verifying MySQL is accepting connections..."
          kubectl exec -n "{{ $var.namespace }}" \
            $(kubectl get pod -n "{{ $var.namespace }}" -l "app.kubernetes.io/name=mysql,app.kubernetes.io/component=primary" -o jsonpath='{.items[0].metadata.name}') \
            -- mysqladmin ping --user=root --password="$MYSQL_ROOT_PASSWORD" 2>/dev/null \
            && echo "[POST_INSTALL] MySQL health check passed." \
            || echo "[POST_INSTALL] WARNING: MySQL ping failed — pod may still be initializing."

      - scope: CLUSTER
        type: BACKUP
        commandTemplate: |
          #!/bin/bash
          set -e
          BACKUP_DIR="/tmp/mysql-backup-$(date +%Y%m%d-%H%M%S)"
          mkdir -p "${BACKUP_DIR}"
          echo "[BACKUP] Starting logical backup of all databases to ${BACKUP_DIR}..."
          PRIMARY_POD=$(kubectl get pod -n "{{ $var.namespace }}" \
            -l "app.kubernetes.io/name=mysql,app.kubernetes.io/component=primary" \
            -o jsonpath='{.items[0].metadata.name}')
          kubectl exec -n "{{ $var.namespace }}" "${PRIMARY_POD}" -- \
            mysqldump --all-databases --single-transaction --quick \
              --user=root --password="$MYSQL_ROOT_PASSWORD" \
            > "${BACKUP_DIR}/all-databases.sql"
          tar -czf "${BACKUP_DIR}.tar.gz" -C /tmp "$(basename ${BACKUP_DIR})"
          rm -rf "${BACKUP_DIR}"
          echo "[BACKUP] Backup saved to ${BACKUP_DIR}.tar.gz"
          echo "[BACKUP] Transfer this file to your off-cluster storage before proceeding with upgrade."

    # Tier-1 API parameters — customer-facing customization surface
    apiParameters:
      - key: releaseName
        name: Release Name
        description: Helm release name for this MySQL installation
        type: String
        required: false
        modifiable: false
        export: true
        defaultValue: "mysql"
        tabIndex: 1

      - key: namespace
        name: Kubernetes Namespace
        description: Kubernetes namespace where MySQL will be deployed
        type: String
        required: false
        modifiable: false
        export: true
        defaultValue: "mysql"
        tabIndex: 2

      - key: privateRegistryUrl
        name: Private Registry URL
        description: "URL of the customer's internal image registry (e.g. registry.internal.corp:5000)"
        type: String
        required: true
        modifiable: false
        export: true
        defaultValue: ""
        tabIndex: 3

      - key: databaseName
        name: Database Name
        description: Name of the initial database to create
        type: String
        required: false
        modifiable: false
        export: true
        defaultValue: "my_database"
        regex: "^[a-zA-Z][a-zA-Z0-9_]{1,62}$"
        tabIndex: 4

      - key: dbUsername
        name: Database Username
        description: MySQL user account to create (in addition to root)
        type: String
        required: false
        modifiable: false
        export: true
        defaultValue: "mysqluser"
        regex: "^[a-zA-Z][a-zA-Z0-9_]{1,31}$"
        tabIndex: 5

      - key: primaryStorageSize
        name: Primary Storage Size
        description: "Persistent volume size for the MySQL primary node (e.g. 8Gi, 50Gi, 200Gi)"
        type: String
        required: false
        modifiable: false
        export: true
        defaultValue: "8Gi"
        tabIndex: 6

# Licensing: signed offline license baked into installer; expires at expiration date
# (no auto-rotation in disconnected mode). Mount at /var/subscription/ via
# the generated secret `service-plan-subscription-license`.
features:
  CUSTOMER:
    licensing:
      licenseExpirationInDays: 365
