# yaml-language-server: $schema=https://api.omnistrate.cloud/2022-09-01-00/schema/service-spec-schema.json
#
# RabbitMQ — Bitnami Helm chart
# Chart version: 16.0.14  (bitnami/rabbitmq, appVersion 4.1.3)
# Deployment model: Hosted (hostedDeployment)
# Cloud: AWS us-east-1
# Phase: initial zero-parameterization build
#
# Source: every field copied from HELM_ONBOARDING_REFERENCE.md or DEPLOYMENT_MODELS_REFERENCE.md.
# Endpoint guidance for mixed TCP+HTTP: see GAPS section in rabbitmq-gaps.md.

name: RabbitMQ
deployment:
  hostedDeployment:
    # Replace with values from: omnistrate-ctl account describe <your-account>
    AwsAccountId: "<AWS_ACCOUNT_ID>"
    AWSBootstrapRoleAccountArn: "arn:aws:iam::<AWS_ACCOUNT_ID>:role/omnistrate-bootstrap-role"

services:
  - name: RabbitMQ Cluster
    # --- Compute ---
    compute:
      instanceTypes:
        - cloudProvider: aws
          # t3.large gives ~2 vCPU / 8 GiB; suitable for small clusters.
          # Change to t3.xlarge (4 vCPU / 16 GiB) for production workloads.
          name: t3.large
      replicaCount: 3

    # --- Ports (informational; drives node-pool SG rules) ---
    network:
      ports:
        - 5672   # AMQP (TCP)
        - 15672  # Management UI (HTTP)

    # --- Endpoint configuration ---
    # AMQP (TCP, port 5672): surfaced as the primary connection endpoint.
    # Management UI (HTTP, port 15672): surfaced as a secondary endpoint.
    #
    # NOTE ON LOAD BALANCER PLACEMENT:
    # HELM_ONBOARDING_REFERENCE.md §"Plan-level L7 HTTPS load balancer" covers HTTP via
    # loadBalancers.https with targetKubernetesServiceName.  TCP (AMQP) is NOT covered
    # by the reference for the Helm/ServicePlanSpec path — no tcp load-balancer block is
    # defined in the reference.  See rabbitmq-gaps.md GAP-1 for details.
    #
    # This spec uses external-dns annotation on the chart service (LoadBalancer type)
    # to assign a per-instance hostname.  The chart's single Service exposes both
    # 5672 and 15672 on the same LoadBalancer IP; endpointConfiguration surfaces them
    # as two named endpoints to the customer.
    endpointConfiguration:
      amqp:
        # $sys.network.externalClusterEndpoint resolves after the LB Service is provisioned.
        host: "$sys.network.externalClusterEndpoint"
        ports:
          - 5672
        primary: true
        networkingType: PUBLIC
      managementUI:
        host: "$sys.network.externalClusterEndpoint"
        ports:
          - 15672
        primary: false
        networkingType: PUBLIC

    # --- Helm chart ---
    helmChartConfiguration:
      chartName: rabbitmq
      chartVersion: 16.0.14
      chartRepoName: bitnami
      chartRepoURL: https://charts.bitnami.com/bitnami

      # Affinity injection: ON (default). Omnistrate injects node affinity and pod
      # anti-affinity so replicas land on separate managed nodes.
      chartAffinityControl:
        enableInjection: true
        enableSharedHost: false   # strict anti-affinity across 3 replicas

      runtimeConfiguration:
        wait: true
        timeoutNanos: 900000000000   # 15 minutes — cluster formation takes time

      chartValues:
        # -- Auth (hardcoded for Phase 1; parameterize in Phase 2) --
        auth:
          username: "admin"
          password: "ChangeMe123!"
          erlangCookie: "ChangeMe456!"

        # -- Clustering (Kubernetes peer discovery is bundled via rabbitmq_peer_discovery_k8s) --
        clustering:
          enabled: true
          addressType: hostname
          partitionHandling: autoheal

        # -- Replica count: fixed at 3 for Phase 1 --
        replicaCount: 3

        # -- Memory high watermark: disabled in Phase 1; enable via parameter in Phase 2 --
        memoryHighWatermark:
          enabled: false
          type: relative
          value: 0.4

        # -- Plugins: management UI is included in the default set --
        plugins: "rabbitmq_management rabbitmq_peer_discovery_k8s"

        # -- Service: LoadBalancer so external-dns can assign per-instance hostname --
        # NOTE: Setting service.type = LoadBalancer means ONE cloud LB serves BOTH 5672
        # and 15672.  This is the only option the chart natively supports for external
        # access without an Ingress.  See rabbitmq-gaps.md GAP-1 for the gap in
        # TCP+HTTP mixed-LB guidance in the reference docs.
        service:
          type: LoadBalancer
          annotations:
            external-dns.alpha.kubernetes.io/hostname: $sys.network.externalClusterEndpoint
          portEnabled: true
          managerPortEnabled: true
          ports:
            amqp: 5672
            manager: 15672

        # -- Persistence --
        # storageClass is Tier 3 (Omnistrate-managed); leave blank so the platform
        # selects the appropriate class (gp3 on AWS).
        persistence:
          enabled: true
          storageClass: ""
          size: 10Gi

        # -- Resources --
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "2000m"
            memory: "2Gi"

    # --- API parameters (Tier-1 — approved for customer exposure) ---
    # Phase 1 = zero parameterization. Parameters listed here are the RECOMMENDED
    # Tier-1 set from the customization-discovery step (HELM_ONBOARDING_REFERENCE.md §5).
    # Add them ONE AT A TIME (one per build-deploy cycle) in Phase 2.
    apiParameters:
      - key: adminUsername
        name: Admin Username
        description: RabbitMQ administrator username for the default vhost.
        type: String
        required: false
        modifiable: false
        export: true
        defaultValue: "admin"
        regex: "^[a-zA-Z0-9_]{3,32}$"
        tabIndex: 1

      - key: adminPassword
        name: Admin Password
        description: RabbitMQ administrator password. Must be at least 12 characters.
        type: Password
        required: true
        modifiable: false
        export: false
        tabIndex: 2

      - key: numReplicas
        name: Replica Count
        description: Number of RabbitMQ nodes in the cluster. Must be an odd number for quorum.
        type: Float64
        required: false
        modifiable: true
        export: true
        defaultValue: "3"
        limits:
          min: 1
          max: 7
        tabIndex: 3

      - key: storageSizeGi
        name: Storage Size (GiB)
        description: Persistent disk size per RabbitMQ node.
        type: Float64
        required: false
        modifiable: false
        export: true
        defaultValue: "10"
        limits:
          min: 8
          max: 500
        tabIndex: 4

      - key: memoryHighWatermarkValue
        name: Memory High Watermark
        description: Fraction of available RAM at which RabbitMQ starts throttling publishers (e.g. 0.4 = 40%). Reduce if nodes are OOM-killed.
        type: Float64
        required: false
        modifiable: true
        export: true
        defaultValue: "0.4"
        limits:
          min: 0.2
          max: 0.8
        tabIndex: 5
