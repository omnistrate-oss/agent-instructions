# yaml-language-server: $schema=https://api.omnistrate.cloud/2022-09-01-00/schema/service-spec-schema.json
#
# Harbor Container Registry — BYOC-K8s deployment
# Deployment model: byoaDeployment (deployed with --cloud-provider byoc-onprem --region on-prem)
# Chart: harbor/harbor v1.19.1 (app v2.15.1)
#
# External-dependency decision (BYOC-K8s context):
#   Option A (chosen): in-cluster PostgreSQL + Redis bundled by the chart, PVC-backed storage.
#   Justification: BYOC-K8s deploys into the *customer-owned* cluster. Terraform runs in the
#   cloud-account that the deployment model targets — but byoc-onprem has no cloud-account
#   terraform target (no AWS/GCP/Azure account is managed by Omnistrate). Therefore the
#   Option B terraform RDS/ElastiCache pattern from HELM_ONBOARDING_REFERENCE.md §External
#   dependencies does not cleanly apply on BYOC-K8s. In-cluster chart defaults (PostgreSQL +
#   Redis + PVC filesystem storage) are the correct call here.
#   S3 storage backend (imageChartStorage.type=s3) remains an option customers with egress
#   to an S3-compatible endpoint can enable via a Tier-2 or custom config, but it is NOT
#   surfaced as a Tier-1 parameter here because BYOC-K8s makes no assumption about cloud
#   account availability.
#
# Gap noted: HELM_ONBOARDING_REFERENCE.md §External dependencies does not address the case
# where terraform-managed cloud services cannot be targeted (BYOC-K8s / byoc-onprem). The
# guide says "terraform runs in whichever account the deployment model targets" but gives no
# guidance for the byoc-onprem case where no such account exists. Recorded as gap.

name: Harbor Container Registry
deployment:
  byoaDeployment:
    # ISV provisioner account — BYOC model uses the ISV provisioner account for
    # control-plane identity; customer cluster is onboarded via the install kit.
    # Replace with real ISV provisioner account values before building.
    AwsAccountId: "<ISV_PROVISIONER_AWS_ACCOUNT_ID>"
    AWSBootstrapRoleAccountArn: "arn:aws:iam::<ISV_PROVISIONER_AWS_ACCOUNT_ID>:role/omnistrate-bootstrap-role"

services:
  - name: Harbor Registry
    # BYOC-K8s: use internal endpoint — customer cluster controls ingress/LB.
    # Per DEPLOYMENT_MODELS_REFERENCE.md §BYOC-K8s §Spec implications:
    #   "For a customer cluster you typically expose the product on an internal endpoint"
    network:
      ports:
        - 80
        - 443
    endpointConfiguration:
      registryEndpoint:
        host: "$sys.network.internalClusterEndpoint"
        ports:
          - 443
        primary: true
        networkingType: INTERNAL

    helmChartConfiguration:
      chartName: harbor
      chartVersion: 1.19.1
      chartRepoName: harbor
      chartRepoURL: https://helm.goharbor.io

      # Automatic affinity injection is enabled (default).
      # Omnistrate merges its node-affinity rules with whatever the chart sets.
      chartAffinityControl:
        enableInjection: true
        enableSharedHost: true

      runtimeConfiguration:
        wait: true
        # Harbor DB init is slow; 10-min timeout.
        timeoutNanos: 600000000000

      chartValues:
        # ---- Expose ----
        # BYOC-K8s: customer owns ingress/LB. Use clusterIP so the chart does not
        # attempt to provision a cloud LB (which Omnistrate does not manage here).
        expose:
          type: clusterIP
          tls:
            enabled: true
            certSource: auto
          clusterIP:
            name: harbor
            ports:
              httpPort: 80
              httpsPort: 443

        # externalURL must match what the customer's ingress exposes.
        # Tier-1 parameter so the customer can set their actual hostname.
        externalURL: $var.externalURL

        # ---- Admin credentials ----
        harborAdminPassword: $var.adminPassword
        # secretKey must be exactly 16 chars; kept ISV-hardcoded.
        secretKey: "changeme-16chars"

        # ---- Persistence (Option A: PVC-backed, in-cluster) ----
        persistence:
          enabled: true
          resourcePolicy: "keep"
          persistentVolumeClaim:
            registry:
              storageClass: ""    # use cluster default StorageClass (Tier 3 — ISV/platform owned)
              accessMode: ReadWriteOnce
              size: $var.registryStorageGi
            jobservice:
              jobLog:
                storageClass: ""
                accessMode: ReadWriteOnce
                size: 1Gi
            database:
              storageClass: ""
              accessMode: ReadWriteOnce
              size: 1Gi
            redis:
              storageClass: ""
              accessMode: ReadWriteOnce
              size: 1Gi
            trivy:
              storageClass: ""
              accessMode: ReadWriteOnce
              size: 5Gi
          imageChartStorage:
            # filesystem = in-cluster PVC storage (Option A).
            # Customers with S3-egress can switch to type: s3 via Tier-2/custom config.
            type: filesystem
            filesystem:
              rootdirectory: /storage

        # ---- Internal DB (Option A: bundled PostgreSQL) ----
        database:
          type: internal

        # ---- Internal Redis (Option A: bundled Redis) ----
        redis:
          type: internal

        # ---- Log level ----
        logLevel: $var.logLevel

    apiParameters:
      - key: externalURL
        name: External URL
        description: "The public URL customers will use to reach Harbor (e.g. https://harbor.example.com). Must match your cluster's ingress hostname."
        type: String
        modifiable: true
        required: true
        export: true
        tabIndex: 1

      - key: adminPassword
        name: Admin Password
        description: "Initial Harbor admin password. Change via the portal after first login."
        type: Password
        modifiable: false
        required: true
        export: false
        tabIndex: 2

      - key: registryStorageGi
        name: Registry Storage Size
        description: "Size of the PersistentVolumeClaim used to store container images (GiB suffix, e.g. 50Gi)."
        type: String
        modifiable: false
        required: false
        export: true
        defaultValue: "50Gi"
        tabIndex: 3

      - key: logLevel
        name: Log Level
        description: "Harbor log verbosity."
        type: String
        modifiable: true
        required: false
        export: false
        defaultValue: "info"
        options:
          - "debug"
          - "info"
          - "warning"
          - "error"
          - "fatal"
        tabIndex: 4
