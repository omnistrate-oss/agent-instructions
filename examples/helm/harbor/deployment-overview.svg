<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="Helvetica, Arial, sans-serif">
  <!--
    Omnistrate architecture base template.
    Edited per use-case by the onboarding agent (see DISTRIBUTION_REFERENCE.md).
    Every logical element is a <g> with a stable id; every label is a <text>.
    Colors: #2563eb platform-managed (Omnistrate), #16a34a customer-controlled,
    #6b7280 ISV-controlled defaults, dashed = control traffic.
    USE-CASE EDITS (Harbor / BYOC-K8s):
      #diagram-title → Harbor Container Registry
      #diagram-subtitle → BYOC-K8s / byoaDeployment
      #boundary-label → Customer's Kubernetes Cluster — byoc-onprem (customer-owned infra)
      #workload-label-1 → Harbor (core + registry + portal + jobservice)
      #workload-slot-2 visible; #workload-label-2 → PostgreSQL (in-cluster)
      #workload-slot-3 visible; #workload-label-3 → Redis (in-cluster)
      #cell-amenities text → customer-provided StorageClasses / ingress
      #param-line-1 → externalURL (required)
      #param-line-2 → adminPassword (Password)
      #param-line-3 → registryStorageGi = 50Gi
      #param-line-4 → logLevel = info
      managed-services left hidden (no terraform dependencies — BYOC-K8s / Option A)
  -->

  <!-- background -->
  <rect x="0" y="0" width="1200" height="800" fill="#ffffff"/>

  <!-- ===================== TITLE ===================== -->
  <g id="title">
    <text id="diagram-title" x="40" y="44" font-size="24" font-weight="bold" fill="#111827">Service deployment overview — Harbor Container Registry</text>
    <text id="diagram-subtitle" x="40" y="70" font-size="15" fill="#6b7280">Deployment model: byoaDeployment (BYOC-K8s / byoc-onprem)</text>
  </g>

  <!-- ===================== CONTROL PLANE ===================== -->
  <g id="control-plane">
    <rect x="40" y="110" width="330" height="210" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="205" y="138" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">Omnistrate Generated Control Plane</text>
    <text x="205" y="160" font-size="12" fill="#6b7280" text-anchor="middle">(runs in ISV account)</text>

    <rect x="62" y="176" width="286" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
    <text x="205" y="198" font-size="13" fill="#1e3a8a" text-anchor="middle">API + Fleet orchestration</text>

    <rect x="62" y="218" width="286" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
    <text id="portal-label" x="205" y="240" font-size="13" fill="#1e3a8a" text-anchor="middle">Customer Portal (auto-deployed per environment)</text>

    <rect x="62" y="260" width="286" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
    <text x="205" y="282" font-size="13" fill="#1e3a8a" text-anchor="middle">Billing / Metering</text>
  </g>

  <!-- ===================== CUSTOMERS ===================== -->
  <g id="customers">
    <rect x="40" y="400" width="200" height="90" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="140" y="432" font-size="15" font-weight="bold" fill="#16a34a" text-anchor="middle">Your customers</text>
    <text x="140" y="456" font-size="11" fill="#166534" text-anchor="middle">sign up / subscribe /</text>
    <text x="140" y="472" font-size="11" fill="#166534" text-anchor="middle">create instances</text>
    <!-- arrow from customers up into the portal -->
    <path id="customer-portal-link" d="M 150 400 L 180 250" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  </g>

  <!-- ===================== DATA PLANE BOUNDARY ===================== -->
  <g id="dataplane-boundary">
    <rect x="430" y="110" width="620" height="580" rx="14" fill="#fafafa" stroke="#111827" stroke-width="2" stroke-dasharray="1 0"/>
    <text id="boundary-label" x="450" y="138" font-size="16" font-weight="bold" fill="#111827">Customer's Kubernetes Cluster — byoc-onprem (customer-owned infra)</text>

    <!-- DEPLOYMENT CELL -->
    <g id="deployment-cell">
      <rect x="454" y="158" width="572" height="332" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
      <text x="470" y="182" font-size="14" font-weight="bold" fill="#374151">Deployment Cell — Kubernetes cluster (per account + region)</text>

      <!-- Omnistrate agents inside the cell -->
      <g id="dp-agent">
        <rect x="470" y="198" width="240" height="44" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
        <text x="590" y="220" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Omnistrate agents</text>
        <text x="590" y="236" font-size="11" fill="#1e3a8a" text-anchor="middle">(outbound only)</text>
      </g>

      <!-- Workload slots (green = customer-influenced placeholders) -->
      <g id="workloads">
        <text x="470" y="272" font-size="12" fill="#6b7280">Workloads</text>
        <g id="workload-slot-1">
          <rect x="470" y="282" width="150" height="60" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
          <text id="workload-label-1" x="545" y="308" font-size="11" fill="#166534" text-anchor="middle">Harbor</text>
          <text x="545" y="325" font-size="10" fill="#166534" text-anchor="middle">(core/registry/portal/jobservice)</text>
        </g>
        <g id="workload-slot-2">
          <rect x="634" y="282" width="120" height="60" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
          <text id="workload-label-2" x="694" y="316" font-size="12" fill="#166534" text-anchor="middle">PostgreSQL</text>
        </g>
        <g id="workload-slot-3">
          <rect x="768" y="282" width="120" height="60" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
          <text id="workload-label-3" x="828" y="316" font-size="12" fill="#166534" text-anchor="middle">Redis</text>
        </g>
        <g id="workload-slot-4" display="none">
          <rect x="878" y="282" width="120" height="60" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
          <text id="workload-label-4" x="938" y="316" font-size="12" fill="#166534" text-anchor="middle">workload</text>
        </g>
      </g>

      <!-- Cell amenities note — relabeled for BYOC-K8s -->
      <g id="cell-amenities">
        <rect x="470" y="418" width="556" height="52" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1" stroke-dasharray="4 3"/>
        <text x="748" y="440" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">cell amenities</text>
        <text x="748" y="458" font-size="11" fill="#6b7280" text-anchor="middle">(customer-provided StorageClasses / ingress)</text>
      </g>
    </g>

    <!-- MANAGED SERVICES STRIP — hidden (BYOC-K8s Option A: no terraform-managed cloud services) -->
    <g id="managed-services" display="none">
      <text x="454" y="524" font-size="12" fill="#6b7280">Terraform-managed dependencies</text>
      <g id="svc-rds">
        <rect x="454" y="534" width="170" height="60" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
        <text x="539" y="568" font-size="13" fill="#374151" text-anchor="middle">Amazon RDS</text>
        <path d="M 539 534 L 539 342" fill="none" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow-gray)"/>
      </g>
      <g id="svc-cache">
        <rect x="644" y="534" width="170" height="60" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
        <text x="729" y="568" font-size="13" fill="#374151" text-anchor="middle">ElastiCache</text>
        <path d="M 729 534 L 729 342" fill="none" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow-gray)"/>
      </g>
      <g id="svc-s3">
        <rect x="834" y="534" width="170" height="60" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
        <text x="919" y="568" font-size="13" fill="#374151" text-anchor="middle">S3 bucket</text>
        <path d="M 919 534 L 919 342" fill="none" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow-gray)"/>
      </g>
    </g>

    <!-- INGRESS (LB / DNS / TLS) at boundary edge — customer-owned on BYOC-K8s -->
    <g id="ingress">
      <rect x="454" y="614" width="280" height="60" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
      <text x="594" y="640" font-size="13" font-weight="bold" fill="#166534" text-anchor="middle">Customer Ingress / DNS / TLS</text>
      <text x="594" y="658" font-size="11" fill="#166534" text-anchor="middle">(customer-managed; maps to externalURL)</text>
      <!-- arrow out to the customers actor -->
      <path id="endpoint-arrow" d="M 454 644 L 240 470" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
      <text id="endpoint-label" x="300" y="560" font-size="11" fill="#16a34a">customer endpoint (INTERNAL)</text>
    </g>
  </g>

  <!-- ===================== CONTROL PLANE &lt;-&gt; DP-AGENT LINK ===================== -->
  <path id="cp-link" d="M 470 220 L 370 216" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow-blue)"/>
  <text id="cp-link-label" x="378" y="205" font-size="10" fill="#2563eb">outbound mTLS/gRPC — no inbound</text>

  <!-- ===================== AIR-GAP NOTE (not applicable for BYOC-K8s) ===================== -->
  <g id="airgap-note" display="none">
    <rect x="376" y="60" width="220" height="56" rx="6" fill="#fef3c7" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="486" y="84" font-size="11" fill="#374151" text-anchor="middle">signed installer artifact</text>
    <text x="486" y="100" font-size="11" fill="#374151" text-anchor="middle">delivered offline</text>
    <path d="M 486 116 L 550 198" fill="none" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow-gray)"/>
  </g>

  <!-- ===================== CUSTOMER CONTROLS PANEL ===================== -->
  <g id="customer-controls">
    <rect x="1070" y="110" width="110" height="440" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="1125" y="136" font-size="12" font-weight="bold" fill="#16a34a" text-anchor="middle">Customer controls</text>
    <text x="1125" y="152" font-size="10" fill="#166534" text-anchor="middle">(API parameters)</text>
    <text id="param-line-1" x="1082" y="184" font-size="11" fill="#166534">• externalURL</text>
    <text id="param-line-2" x="1082" y="208" font-size="11" fill="#166534">• adminPassword</text>
    <text id="param-line-3" x="1082" y="232" font-size="11" fill="#166534">• registryStorageGi=50Gi</text>
    <text id="param-line-4" x="1082" y="256" font-size="11" fill="#166534">• logLevel=info</text>
    <text id="param-line-5" x="1082" y="280" font-size="11" fill="#166534" display="none">• &lt;param 5&gt;</text>
    <text id="param-line-6" x="1082" y="304" font-size="11" fill="#166534" display="none">• &lt;param 6&gt;</text>
    <line x1="1082" y1="500" x2="1168" y2="500" stroke="#16a34a" stroke-width="1"/>
    <text x="1082" y="520" font-size="9" fill="#6b7280">Everything else:</text>
    <text x="1082" y="533" font-size="9" fill="#6b7280">ISV defaults +</text>
    <text x="1082" y="546" font-size="9" fill="#6b7280">platform-managed</text>
  </g>

  <!-- ===================== LEGEND ===================== -->
  <g id="legend">
    <rect x="40" y="620" width="360" height="140" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
    <text x="60" y="646" font-size="13" font-weight="bold" fill="#111827">Legend</text>

    <rect x="60" y="660" width="18" height="14" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="88" y="672" font-size="12" fill="#374151">Platform-managed (Omnistrate)</text>

    <rect x="60" y="684" width="18" height="14" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="88" y="696" font-size="12" fill="#374151">Customer-controlled</text>

    <rect x="60" y="708" width="18" height="14" rx="3" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
    <text x="88" y="720" font-size="12" fill="#374151">ISV-controlled defaults</text>

    <line x1="60" y1="738" x2="78" y2="738" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="88" y="742" font-size="12" fill="#374151">Control traffic (outbound only)</text>
  </g>

  <!-- ===================== ARROW MARKERS ===================== -->
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
  </defs>
</svg>
